{% extends "base.html" %}
{% block page %}Diagnostics{% endblock %}
{% block content %}
<div id="hint" class="banner" style="display:none"></div>

<div class="tiles" style="margin-bottom:16px">
  <div class="tile"><div class="lbl">Addressing</div><div class="val" id="d-scheme" style="font-size:20px">–</div></div>
  <div class="tile"><div class="lbl">OBD standard (01 1C)</div><div class="val" id="d-std" style="font-size:15px;font-family:var(--ui)">–</div></div>
  <div class="tile"><div class="lbl">Supported PIDs</div><div class="val" id="d-count">–</div></div>
</div>

<div class="card">
  <h2>Supported PIDs (mode 01)</h2>
  <div id="d-pids" class="muted">connect in Normal mode…</div>
</div>

<div class="card">
  <h2>Live standard values</h2>
  <table class="data"><thead><tr><th>Signal</th><th class="num">Value</th><th>Unit</th><th class="num">Age</th></tr></thead>
    <tbody id="d-vals"><tr><td colspan="4" class="muted">—</td></tr></tbody></table>
</div>
{% endblock %}
{% block script %}<script>
(function(){
  const $=s=>document.querySelector(s);
  const UNIT={rpm:"rpm",speed:"km/h",coolant:"°C",fuel:"%",throttle:"%",load:"%",intake:"°C",maf:"g/s",
    volt:"V",map:"kPa",timing:"°",runtime:"s",baro:"kPa",ambient:"°C",oil_temp:"°C",fuel_rate:"L/h",fuel_pressure:"kPa",obd_std:""};
  async function tick(){
    let j=null;try{ j=await api("/api/obd2"); }catch(e){}
    const hint=$("#hint");
    if(!j||!j.connected)   {hint.style.display="block";hint.textContent="Not connected — use Connect (Normal mode).";}
    else if(j.mode!=="normal"){hint.style.display="block";hint.textContent="OBD2 diagnostics need Normal mode (reconnect).";}
    else if(!j.scheme)     {hint.style.display="block";hint.textContent="Waiting for OBD2 responses… (ignition on / engine running?)";}
    else hint.style.display="none";
    if(!j)return;
    $("#d-scheme").textContent=j.scheme||"–";
    $("#d-std").textContent=j.obd_standard||"–";
    $("#d-count").textContent=j.supported_count||0;
    $("#d-pids").innerHTML=(j.supported&&j.supported.length)
      ? j.supported.map(p=>`<span class="badge">${p}</span>`).join("")
      : '<span class="muted">none yet</span>';
    const vals=j.values||{},names=Object.keys(vals).sort();
    $("#d-vals").innerHTML=names.length
      ? names.map(n=>`<tr><td>${n}</td><td class="num">${vals[n].value}</td><td class="muted">${UNIT[n]??""}</td><td class="num">${vals[n].age.toFixed(1)}s</td></tr>`).join("")
      : '<tr><td colspan="4" class="muted">—</td></tr>';
  }
  tick();setInterval(tick,800);
})();
</script>{% endblock %}
