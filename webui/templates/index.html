<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Fiat 500 · OBD2 Live Cluster</title>
<style>
  :root{
    color-scheme: dark;
    --bg:#070A10; --bg-2:#0A0E16; --panel:#0E131D; --panel-2:#131A26;
    --edge:#223044; --edge-soft:#18212F;
    --ink:#EAF2F7; --ink-dim:#93A3B4; --ink-faint:#566274;
    --cyan:#2FE0D2; --cold:#4FA6FF; --ok:#38D07C; --warn:#FFB020; --crit:#FF3B47;
    --font-data: ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,monospace;
    --font-ui:"Roboto Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
    --gap:clamp(8px,1.2vw,16px);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 90% at 50% -10%,#0E1420 0%,var(--bg) 60%,#05070C 100%);
       color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .cluster{min-height:100vh;display:grid;grid-template-rows:auto auto auto 1fr auto auto;
           gap:var(--gap);padding:clamp(10px,1.4vw,20px);max-width:1600px;margin:0 auto;}

  .statusbar,.controls{display:flex;align-items:center;gap:14px;padding:6px 14px;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--edge-soft);border-radius:12px;
    font-size:clamp(11px,1vw,13px);letter-spacing:.12em;text-transform:uppercase;}
  .sb-conn{display:flex;align-items:center;gap:8px;color:var(--ink-dim);}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--ink-faint);}
  .dot.on{background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sb-src{color:var(--warn);font-weight:700;}
  .rec{display:none;align-items:center;gap:6px;color:var(--crit);font-weight:700;}
  .rec.on{display:flex;}
  .rec .led{width:9px;height:9px;border-radius:50%;background:var(--crit);box-shadow:0 0 10px var(--crit);animation:flash .8s steps(1) infinite;}
  @keyframes flash{50%{opacity:.2}}
  .sb-title{margin-left:auto;margin-right:auto;color:var(--ink);font-weight:700;letter-spacing:.28em;font-size:1.05em;}
  .sb-metric{font-family:var(--font-data);color:var(--ink);font-variant-numeric:tabular-nums;}
  .sb-metric b{color:var(--cyan);font-weight:700;}
  .spacer{margin-left:auto;}
  .btn,select,input{font-family:var(--font-ui);font-size:.85em;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;padding:6px 12px;cursor:pointer;}
  input{text-transform:none;letter-spacing:0;font-family:var(--font-data);min-width:120px;cursor:text;}
  .btn:hover,select:hover{border-color:var(--cyan);}
  .btn.primary{border-color:var(--cyan);color:var(--cyan);}
  .btn.danger{border-color:var(--crit);color:var(--crit);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .ctl-label{color:var(--ink-faint);font-size:.85em;}

  .shiftlights{display:flex;justify-content:center;gap:6px;padding:4px 0;}
  .sl{width:min(3.2vw,42px);height:9px;border-radius:3px;background:#141b26;border:1px solid var(--edge-soft);transition:opacity .05s;}
  .sl[data-on="g"]{background:var(--ok);box-shadow:0 0 10px var(--ok);border-color:var(--ok);}
  .sl[data-on="a"]{background:var(--warn);box-shadow:0 0 10px var(--warn);border-color:var(--warn);}
  .sl[data-on="r"]{background:var(--crit);box-shadow:0 0 12px var(--crit);border-color:var(--crit);}
  .shiftlights.redline .sl[data-on="r"]{animation:flash .18s steps(1) infinite;}

  .hero{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,48px);min-height:0;}
  .gauge{--sz:min(40vw,52vh,440px);position:relative;width:var(--sz);height:var(--sz);flex:0 0 auto;}
  .gauge canvas{width:100%;height:100%;display:block;}
  .hub{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:2px;transform:translateY(4%);}
  .hub-val{font-family:var(--font-data);font-weight:700;font-size:calc(var(--sz)*0.26);line-height:.92;letter-spacing:-0.03em;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 22px rgba(47,224,210,.25);}
  .hub-unit{font-size:calc(var(--sz)*0.055);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim);}
  .hub-cap{font-size:calc(var(--sz)*0.05);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);margin-top:calc(var(--sz)*0.03);}
  .center-col{display:flex;flex-direction:column;align-items:center;gap:14px;align-self:center;}
  .gear{font-family:var(--font-data);font-weight:700;font-size:clamp(40px,6vw,84px);line-height:1;color:var(--cyan);text-shadow:0 0 26px rgba(47,224,210,.4);width:1.5em;text-align:center;border:1px solid var(--edge);border-radius:14px;padding:.08em .1em .02em;background:linear-gradient(180deg,var(--panel-2),var(--panel));}
  .gear-lbl,.trip{font-size:clamp(10px,1vw,12px);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-faint);}
  .trip b{font-family:var(--font-data);color:var(--ink-dim);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;}

  .tiles{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(148px,1fr));}
  .tile{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--edge-soft);border-radius:12px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;}
  .tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--stripe,transparent);}
  .tile-head{display:flex;align-items:baseline;justify-content:space-between;}
  .tile-label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);}
  .tile-pid{font-family:var(--font-data);font-size:9.5px;color:var(--ink-faint);}
  .tile-val{font-family:var(--font-data);font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px;}
  .tile-val .v{font-size:clamp(26px,3.2vw,40px);font-weight:700;letter-spacing:-0.02em;color:var(--valcol,var(--cyan));line-height:1;}
  .tile-val .u{font-size:13px;color:var(--ink-dim);font-family:var(--font-ui);letter-spacing:.05em;}
  .bar{position:relative;height:8px;border-radius:5px;background:#0c121b;border:1px solid var(--edge-soft);overflow:hidden;}
  .bar-fill{position:absolute;inset:0 auto 0 0;width:0%;background:var(--valcol,var(--cyan));border-radius:5px;transition:width .12s linear,background .2s;}
  .bar-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink-faint);opacity:.7;}
  .bar-tick.warn{background:var(--warn);}.bar-tick.crit{background:var(--crit);}
  .tile-range{display:flex;justify-content:space-between;font-family:var(--font-data);font-size:10px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
  .chip{font-size:9px;letter-spacing:.14em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid transparent;}
  .chip:empty{display:none;}
  .tile[data-state="ok"]{--stripe:transparent;--valcol:var(--cyan);}
  .tile[data-state="cold"]{--stripe:var(--cold);--valcol:var(--cold);}
  .tile[data-state="warn"]{--stripe:var(--warn);--valcol:var(--warn);border-color:rgba(255,176,32,.35);}
  .tile[data-state="warn"] .chip{color:var(--warn);border-color:rgba(255,176,32,.4);}
  .tile[data-state="crit"]{--stripe:var(--crit);--valcol:var(--crit);border-color:rgba(255,59,71,.5);animation:critpulse 1s ease-in-out infinite;}
  .tile[data-state="crit"] .chip{color:var(--crit);border-color:rgba(255,59,71,.5);}
  @keyframes critpulse{0%,100%{box-shadow:0 0 0 rgba(255,59,71,0)}50%{box-shadow:0 0 16px rgba(255,59,71,.35)}}
  .tile[data-state="stale"]{--valcol:var(--ink-dim);}
  .tile[data-state="stale"] .tile-val .v{opacity:.5;}.tile[data-state="stale"] .bar-fill{opacity:.4;}
  .tile[data-state="stale"] .chip{color:var(--ink-dim);border-color:var(--edge);}
  .tile[data-state="na"]{--valcol:var(--ink-faint);background:repeating-linear-gradient(135deg,var(--panel) 0 8px,var(--bg-2) 8px 16px);border-style:dashed;border-color:var(--edge);}
  .tile[data-state="na"] .tile-val .v{color:var(--ink-faint);}.tile[data-state="na"] .bar{opacity:.3;}
  .tile[data-state="na"] .chip{color:var(--ink-faint);border-color:var(--edge);}.tile[data-state="na"] .tile-range{opacity:.4;}

  .telltales{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:8px;background:var(--bg-2);border:1px solid var(--edge-soft);border-radius:12px;}
  .tt{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:8px;border:1px solid var(--edge-soft);background:var(--panel);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);}
  .tt .led{width:8px;height:8px;border-radius:50%;background:var(--edge);}
  .tt[data-on="warn"]{color:var(--warn);border-color:rgba(255,176,32,.5);}.tt[data-on="warn"] .led{background:var(--warn);box-shadow:0 0 10px var(--warn);}
  .tt[data-on="crit"]{color:var(--crit);border-color:rgba(255,59,71,.6);animation:flash .5s steps(1) infinite;}.tt[data-on="crit"] .led{background:var(--crit);box-shadow:0 0 12px var(--crit);}

  @media (max-width:760px){.hero{flex-direction:column;}.center-col{order:-1;flex-direction:row;gap:20px;}.gauge{--sz:min(78vw,340px);}
    .statusbar,.controls{flex-wrap:wrap;}}
</style>
</head>
<body>
<div class="cluster">
  <!-- status bar -->
  <div class="statusbar">
    <div class="sb-conn"><span class="dot" id="dot"></span> <span id="conn">OFFLINE</span> · <span class="sb-src" id="src">—</span></div>
    <div class="rec" id="rec"><span class="led"></span> REC</div>
    <div class="sb-title">FIAT 500 · OBD2</div>
    <div class="sb-metric">BATT <b id="sb-volt">--.-</b> V</div>
    <div class="sb-metric" id="clock" style="min-width:8ch;text-align:right">--:--:--</div>
  </div>

  <!-- controls -->
  <div class="controls">
    <span class="ctl-label">Mode</span>
    <select id="mode"><option value="normal">Normal (dashboard + OBD2)</option><option value="listen">Listen-only (passive)</option></select>
    <button class="btn primary" id="btn-conn">Connect</button>
    <span class="spacer"></span>
    <span class="ctl-label">Label</span>
    <input id="label" value="drive" placeholder="log label">
    <button class="btn" id="btn-rec">● Record raw + OBD2</button>
    <span id="frames" class="sb-metric" style="min-width:11ch"></span>
  </div>

  <div class="shiftlights" id="shift"></div>

  <div class="hero">
    <div class="gauge" data-key="rpm"><canvas></canvas>
      <div class="hub"><div class="hub-val" id="rpm-v">0</div><div class="hub-unit">rpm ×1000</div><div class="hub-cap">ENGINE</div></div>
    </div>
    <div class="center-col"><div class="gear-lbl">GEAR</div><div class="gear" id="gear">–</div><div class="trip">TRIP <b id="trip">0.00</b> km</div></div>
    <div class="gauge" data-key="speed"><canvas></canvas>
      <div class="hub"><div class="hub-val" id="speed-v">0</div><div class="hub-unit">km/h</div><div class="hub-cap">VEHICLE</div></div>
    </div>
  </div>

  <div class="tiles" id="tiles"></div>
  <div class="telltales" id="telltales"></div>
</div>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  const T=()=>performance.now();
  const RS=getComputedStyle(document.documentElement);
  const V={};["--ink","--ink-dim","--ink-faint","--edge","--edge-soft","--panel","--panel-2","--cyan","--cold","--ok","--warn","--crit"].forEach(k=>V[k]=RS.getPropertyValue(k).trim());
  const SEVCOL={ok:V["--cyan"],cold:V["--cold"],warn:V["--warn"],crit:V["--crit"],na:V["--ink-faint"]};

  const CFG={
    rpm:{label:"ENGINE",unit:"rpm",pid:"01 0C",min:0,max:7000,tau:90,dec:0,div:1000,tickMajor:1000,tickMinor:500,zones:[[6000,6500,"warn"],[6500,7000,"crit"]],warnHigh:6000,critHigh:6500},
    speed:{label:"VEHICLE",unit:"km/h",pid:"01 0D",min:0,max:180,tau:230,dec:0,div:1,tickMajor:40,tickMinor:20},
    coolant:{label:"COOLANT",unit:"°C",pid:"01 05",min:40,max:120,tau:650,dec:0,coldBelow:70,warnHigh:110,critHigh:120,ticks:[70,110,120]},
    fuel:{label:"FUEL",unit:"%",pid:"01 2F",min:0,max:100,tau:850,dec:0,warnLow:15,critLow:8,ticks:[8,15]},
    throttle:{label:"THROTTLE",unit:"%",pid:"01 11",min:0,max:100,tau:180,dec:0},
    load:{label:"ENGINE LOAD",unit:"%",pid:"01 04",min:0,max:100,tau:230,dec:0,warnHigh:90,ticks:[90]},
    intake:{label:"INTAKE AIR",unit:"°C",pid:"01 0F",min:-10,max:80,tau:750,dec:0,warnHigh:60,ticks:[60]},
    maf:{label:"MAF",unit:"g/s",pid:"01 10",min:0,max:100,tau:400,dec:1},
    volt:{label:"MODULE VOLT",unit:"V",pid:"01 42",min:8,max:16,tau:500,dec:1,critLow:11.5,warnLow:12.2,warnHigh:15.0,ticks:[11.5,12.2,15.0]},
  };
  const TILE_KEYS=["coolant","fuel","throttle","load","intake","maf","volt"];
  const FAST=["rpm","speed","throttle","load"];
  const S={};Object.keys(CFG).forEach(k=>S[k]={raw:null,disp:CFG[k].min,supported:true,last:0});

  function sev(k,v){if(v==null)return "na";const c=CFG[k];
    if(c.critLow!=null&&v<=c.critLow)return "crit";if(c.critHigh!=null&&v>=c.critHigh)return "crit";
    if(c.warnLow!=null&&v<=c.warnLow)return "warn";if(c.warnHigh!=null&&v>=c.warnHigh)return "warn";
    if(c.coldBelow!=null&&v<c.coldBelow)return "cold";return "ok";}
  function dispState(k){const st=S[k];if(!st.supported)return "na";
    const staleMs=FAST.includes(k)?1200:3500;if(T()-st.last>staleMs)return "stale";return "live";}

  // ---------- live feed from backend ----------
  let connected=false, recording=false, scheme=null, frameCount=0;
  let gearNow=0, tripKm=0, lastTrip=T();
  const GBAND=[0,20,42,68,95];
  function gearOf(sp){let g=0;for(let i=0;i<GBAND.length;i++)if(sp>=GBAND[i])g=i;return g;}

  async function poll(){
    let j=null;
    try{ j=await (await fetch("/api/live")).json(); }catch(e){ j=null; }
    if(!j){ connected=false; return; }
    connected=!!j.connected; recording=!!j.recording; scheme=j.scheme; frameCount=j.frame_count||0;
    const now=T(), sup=j.supported_names||[], vals=j.values||{};
    Object.keys(CFG).forEach(k=>{
      if(!connected){ S[k].supported=true; return; }               // disconnected -> ages to STALE
      const v=vals[k];
      S[k].supported = sup.includes(k) || v!=null;
      if(v){ S[k].raw=v.value; S[k].last=now - Math.max(0,v.age)*1000; }
    });
    // trip from live speed
    const t=T(), dt=(t-lastTrip)/1000; lastTrip=t;
    if(dispState("speed")==="live") tripKm += (S.speed.disp/3600)*dt;
    gearNow = dispState("speed")==="live" ? (S.speed.disp<1?0:gearOf(S.speed.disp)+1) : -1;
  }

  // ---------- tiles ----------
  const tilesEl=$("#tiles"),tileRef={};
  TILE_KEYS.forEach(k=>{const c=CFG[k];const el=document.createElement("div");el.className="tile";el.dataset.state="stale";
    el.innerHTML='<div class="tile-head"><span class="tile-label">'+c.label+'</span><span class="tile-pid">'+c.pid+'</span></div>'+
      '<div class="tile-val"><span class="v">--</span><span class="u">'+c.unit+'</span><span class="chip" style="margin-left:auto"></span></div>'+
      '<div class="bar"><div class="bar-fill"></div></div>'+
      '<div class="tile-range"><span>'+c.min+'</span><span>'+c.max+'</span></div>';
    tilesEl.appendChild(el);const bar=el.querySelector(".bar");
    (c.ticks||[]).forEach(tv=>{const pct=(tv-c.min)/(c.max-c.min)*100;const t=document.createElement("div");t.className="bar-tick";
      if((c.critLow!=null&&tv===c.critLow)||(c.critHigh!=null&&tv===c.critHigh))t.className+=" crit";
      else if((c.warnLow!=null&&tv===c.warnLow)||(c.warnHigh!=null&&tv===c.warnHigh))t.className+=" warn";
      t.style.left="calc("+pct+"% - 1px)";bar.appendChild(t);});
    tileRef[k]={root:el,v:el.querySelector(".v"),fill:el.querySelector(".bar-fill"),chip:el.querySelector(".chip")};});

  // ---------- shift lights ----------
  const shiftEl=$("#shift"),SL=[];for(let i=0;i<12;i++){const d=document.createElement("div");d.className="sl";shiftEl.appendChild(d);SL.push(d);}
  function updateShift(){const live=dispState("rpm")==="live";const rpm=live?S.rpm.disp:0;const start=3800,span=6500-start;
    const lit=live?Math.round(clamp((rpm-start)/span,0,1)*12):0;shiftEl.classList.toggle("redline",rpm>=6500);
    for(let i=0;i<12;i++){if(i<lit)SL[i].dataset.on=i<6?"g":(i<10?"a":"r");else SL[i].removeAttribute("data-on");}}

  // ---------- gauges ----------
  const gauges={};
  function initGauge(key){const wrap=document.querySelector('.gauge[data-key="'+key+'"]');const canvas=wrap.querySelector("canvas");
    const g={key,cfg:CFG[key],canvas,ctx:canvas.getContext("2d"),w:0,h:0};
    function size(){const dpr=Math.min(window.devicePixelRatio||1,2);const r=wrap.getBoundingClientRect();g.w=r.width;g.h=r.height;
      canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);g.ctx.setTransform(dpr,0,0,dpr,0,0);}
    size();new ResizeObserver(size).observe(wrap);gauges[key]=g;}
  const START=135*Math.PI/180,SWEEP=270*Math.PI/180;
  function drawGauge(g){const c=g.ctx,cfg=g.cfg,st=S[g.key];const w=g.w,h=g.h,cx=w/2,cy=h*0.54,r=Math.min(w,h)*0.42,lw=r*0.12;
    const ang=v=>START+(clamp(v,cfg.min,cfg.max)-cfg.min)/(cfg.max-cfg.min)*SWEEP;c.clearRect(0,0,w,h);
    c.lineCap="round";c.lineWidth=lw;c.strokeStyle=V["--edge-soft"];c.beginPath();c.arc(cx,cy,r,START,START+SWEEP);c.stroke();
    if(cfg.zones){c.lineCap="butt";c.lineWidth=lw;cfg.zones.forEach(z=>{c.globalAlpha=.4;c.strokeStyle=z[2]==="warn"?V["--warn"]:V["--crit"];c.beginPath();c.arc(cx,cy,r,ang(z[0]),ang(z[1]));c.stroke();c.globalAlpha=1;});}
    const ds=dispState(g.key);const col=ds==="live"?SEVCOL[sev(g.key,st.raw)]:(ds==="stale"?V["--ink-dim"]:V["--ink-faint"]);
    c.lineCap="round";c.lineWidth=lw;c.strokeStyle=col;c.shadowBlur=18;c.shadowColor=col;c.beginPath();c.arc(cx,cy,r,START,ang(st.disp));c.stroke();c.shadowBlur=0;
    c.strokeStyle=V["--ink-dim"];c.fillStyle=V["--ink-dim"];c.font="600 "+Math.round(r*0.1)+"px Roboto Condensed,Arial Narrow,sans-serif";c.textAlign="center";c.textBaseline="middle";
    for(let v=cfg.min;v<=cfg.max+1e-6;v+=cfg.tickMinor){const a=ang(v),maj=Math.abs((v-cfg.min)%cfg.tickMajor)<1e-6;const r1=r*(maj?0.72:0.76),r2=r*0.66;c.lineWidth=maj?2.5:1;
      c.beginPath();c.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);c.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2);c.stroke();
      if(maj){const rl=r*0.5;c.fillText(String(Math.round(v/(cfg.div||1))),cx+Math.cos(a)*rl,cy+Math.sin(a)*rl);}}
    const na=ang(st.disp);c.save();c.translate(cx,cy);c.rotate(na);c.strokeStyle=col;c.lineWidth=Math.max(2,r*0.02);c.lineCap="round";c.beginPath();c.moveTo(-r*0.13,0);c.lineTo(r*0.82,0);c.stroke();c.restore();
    c.beginPath();c.fillStyle=V["--panel-2"];c.arc(cx,cy,r*0.09,0,7);c.fill();c.lineWidth=2;c.strokeStyle=V["--edge"];c.stroke();}
  initGauge("rpm");initGauge("speed");

  // ---------- readouts ----------
  const fmt=(v,c)=>v.toFixed(c.dec);
  const gearEl=$("#gear"),tripEl=$("#trip"),rpmV=$("#rpm-v"),spdV=$("#speed-v"),sbVolt=$("#sb-volt");
  function updateReadouts(){
    const rLive=dispState("rpm")==="live",sLive=dispState("speed")==="live";
    rpmV.textContent=Math.round(S.rpm.disp/10)*10;rpmV.style.color=rLive?SEVCOL[sev("rpm",S.rpm.raw)]:V["--ink-faint"];
    spdV.textContent=Math.round(S.speed.disp);spdV.style.color=sLive?V["--ink"]:V["--ink-faint"];
    gearEl.textContent=gearNow<0?"–":(gearNow===0?"N":String(gearNow));
    tripEl.textContent=tripKm.toFixed(2);
    const vLive=dispState("volt")==="live";sbVolt.textContent=vLive?fmt(S.volt.disp,CFG.volt):"--.-";sbVolt.style.color=vLive?SEVCOL[sev("volt",S.volt.raw)]:V["--ink-faint"];
    TILE_KEYS.forEach(k=>{const c=CFG[k],st=S[k],ref=tileRef[k],ds=dispState(k);const pct=clamp((st.disp-c.min)/(c.max-c.min)*100,0,100);
      if(ds==="na"){ref.root.dataset.state="na";ref.v.textContent="––";ref.fill.style.width="0%";ref.chip.textContent="N/A";}
      else if(ds==="stale"){ref.root.dataset.state="stale";ref.v.textContent=st.raw==null?"--":fmt(st.disp,c);ref.fill.style.width=pct+"%";ref.chip.textContent="STALE";}
      else{const s=sev(k,st.raw);ref.root.dataset.state=s;ref.v.textContent=fmt(st.disp,c);ref.fill.style.width=pct+"%";ref.chip.textContent=(s==="warn"||s==="crit")?s:"";}});
    // status bar
    $("#dot").classList.toggle("on",connected);
    $("#conn").textContent=connected?"LIVE":"OFFLINE";
    $("#src").textContent=connected?((scheme?scheme.toUpperCase()+" ":"")+"OBD2"):"—";
    $("#rec").classList.toggle("on",recording);
    $("#frames").textContent=connected?(frameCount.toLocaleString()+" fr"):"";
    $("#btn-conn").textContent=connected?"Disconnect":"Connect";
    $("#btn-conn").classList.toggle("danger",connected);$("#btn-conn").classList.toggle("primary",!connected);
    $("#btn-rec").textContent=recording?"■ Stop recording":"● Record raw + OBD2";
    $("#btn-rec").classList.toggle("danger",recording);$("#btn-rec").disabled=!connected;
  }

  // ---------- telltales ----------
  const TT=[{id:"mil",label:"CHECK ENGINE"},{id:"fuel",label:"LOW FUEL"},{id:"temp",label:"COOLANT TEMP"},{id:"batt",label:"CHARGE"},{id:"shift",label:"SHIFT UP"}];
  const ttEl=$("#telltales"),ttRef={};
  TT.forEach(t=>{const el=document.createElement("div");el.className="tt";el.innerHTML='<span class="led"></span>'+t.label;ttEl.appendChild(el);ttRef[t.id]=el;});
  function ttState(k){return dispState(k)==="live"?sev(k,S[k].raw):null;}
  function updateTelltales(){const f=ttState("fuel"),co=ttState("coolant"),vo=ttState("volt"),rp=ttState("rpm");
    const set=(id,on)=>{if(on)ttRef[id].dataset.on=on;else ttRef[id].removeAttribute("data-on");};
    set("fuel",f==="crit"?"crit":f==="warn"?"warn":null);set("temp",co==="crit"?"crit":co==="warn"?"warn":null);
    set("batt",vo==="crit"?"crit":vo==="warn"?"warn":null);
    set("shift",rp==="crit"?"crit":(dispState("rpm")==="live"&&S.rpm.raw>=6000)?"warn":null);
    set("mil",[f,co,vo,rp].includes("crit")?"warn":null);}

  // ---------- render loop ----------
  let prev=T();
  function frame(){const t=T(),dt=Math.min(0.1,(t-prev)/1000);prev=t;
    Object.keys(CFG).forEach(k=>{const st=S[k],target=st.raw==null?CFG[k].min:st.raw;const a=1-Math.exp(-dt/(CFG[k].tau/1000));st.disp+=(target-st.disp)*a;});
    drawGauge(gauges.rpm);drawGauge(gauges.speed);updateShift();updateTelltales();updateReadouts();
    requestAnimationFrame(frame);}
  requestAnimationFrame(frame);

  // ---------- controls ----------
  const api=(path,body)=>fetch(path,{method:body!==undefined?"POST":"GET",headers:body!==undefined?{"Content-Type":"application/json"}:{},body:body!==undefined?JSON.stringify(body):undefined}).then(r=>r.json());
  $("#btn-conn").addEventListener("click",async()=>{
    if(connected){ await api("/api/disconnect",{}); }
    else{ const r=await api("/api/connect",{mode:$("#mode").value,bitrate:500000}); if(!r.ok) alert("Connect failed: "+r.error); }
    poll();});
  $("#btn-rec").addEventListener("click",async()=>{
    if(recording){ await api("/api/record/stop",{}); }
    else{ const r=await api("/api/record/start",{label:$("#label").value||"capture"}); if(!r.ok) alert("Record failed: "+r.error); }
    poll();});

  function clock(){const d=new Date();$("#clock").textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");}
  clock();setInterval(clock,1000);

  poll();setInterval(poll,150);
})();
</script>
</body>
</html>
