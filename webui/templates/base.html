<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block page %}{% endblock %} · CAN Sniffer</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">CAN Sniffer<small>ESP32-C6 · SLCAN</small></div>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/diagnostics">Diagnostics</a>
      <a href="/frames">Live frames</a>
    </nav>
    <div class="foot">SLCAN · python-can</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>{{ self.page() }}</h1>
      <span class="spacer"></span>
      <span class="rec" id="c-rec"><span class="led"></span> REC</span>
      <span class="conn"><span class="dot" id="c-dot"></span><span id="c-conn">Disconnected</span></span>
      <span class="conn mono" id="c-frames" style="font-size:12px"></span>
      <select id="c-transport" title="transport">
        <option value="usb">USB</option>
        <option value="wifi">Wi-Fi</option>
      </select>
      <input id="c-host" value="192.168.4.1:3333" size="15" title="Wi-Fi host:port" style="display:none">
      <select id="c-mode" title="connection mode">
        <option value="normal">Normal (OBD2)</option>
        <option value="listen">Listen-only</option>
      </select>
      <button class="btn primary" id="c-connect">Connect</button>
      <input id="c-label" value="drive" size="8" title="recording label">
      <button class="btn" id="c-record" disabled>Record</button>
    </div>

    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
{% block script %}{% endblock %}
</body>
</html>
