; PlatformIO project — XIAO ESP32-C6 SLCAN CAN sniffer/gateway
;
; ESP32-C6 (RISC-V) needs Arduino-ESP32 core 3.x, which the OFFICIAL
; `espressif32` platform does NOT ship for the Arduino framework (its Arduino
; package is still 2.0.17). We therefore use the community "pioarduino" fork,
; pinned to a reproducible release (tag 55.03.39 = arduino-esp32 3.3.9 /
; ESP-IDF 5.5.4). To always track latest, replace the tag with `stable`.
;
; Build / flash / monitor:
;   pio run                 # compile
;   pio run -t upload       # flash over native USB-C
;   pio device monitor      # serial monitor (type `V` then Enter for version)
;
; If upload fails to start: hold BOOT, tap RESET, release BOOT, then upload
; (native USB-Serial/JTAG auto-download can be flaky on the first flash).

[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

; Native USB (USB-Serial/JTAG) exposed as Arduino `Serial` from boot.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; -D PIN_CAN_TX=GPIO_NUM_21   ; uncomment BOTH to swap TX/RX if you see no frames
    ; -D PIN_CAN_RX=GPIO_NUM_2

monitor_speed = 115200
monitor_filters = direct

; upload_port / monitor_port are auto-detected; set explicitly only if needed:
;   macOS  -> /dev/cu.usbmodemXXXX
;   Linux  -> /dev/ttyACMx
;   Windows-> COMx
